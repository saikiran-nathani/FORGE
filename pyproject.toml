[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "1.0.0"
description = "LLM-powered automated ML pipeline builder"
readme = "FORGE.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "optuna>=3.4",
    "mlflow>=2.9",
    "scipy>=1.11",
    "joblib>=1.3",
    "typer>=0.9",
    "rich>=13.0",
    "shap>=0.44",
    "openai>=1.0",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0",
    "plotly>=5.18",
    "jinja2>=3.1",
    "lime>=0.2",
]

[project.optional-dependencies]
# Deep-learning models (MLP, TabTransformer). Not needed for fast-mode runs or
# the deployed API; torch is ~2GB, so it's opt-in to keep the backend image lean.
deep-learning = ["torch>=2.1"]
llm = ["anthropic>=0.18"]
monitoring = ["evidently>=0.4"]
web = ["httpx>=0.26"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
